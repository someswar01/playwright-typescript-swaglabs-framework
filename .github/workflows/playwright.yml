name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SWAGLABS_BASE_URL: ${{ vars.SWAGLABS_BASE_URL || 'https://www.saucedemo.com' }}
      SWAGLABS_APP_USERNAME: ${{ secrets.SWAGLABS_APP_USERNAME || 'standard_user' }}
      SWAGLABS_APP_PASSWORD: ${{ secrets.SWAGLABS_APP_PASSWORD || 'secret_sauce' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Typecheck
      run: npm run typecheck
    - name: Run Playwright tests
      run: npm run test:ci
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          playwright-report/
          allure-results/
        retention-days: 30
